name: Validate

# Pull Requests werden einmal geprüft (nicht zusätzlich beim Push auf den Branch);
# Pushes laufen nur noch auf main.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben PR/Branch bricht den überholten Lauf ab
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Python 3.13 installiert Home Assistant 2026.2, die älteste unterstützte
          # Version: Geprüft wird gegen die Schnittstellen, die mindestens da sein müssen.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Home Assistant wird für die Typprüfung gebraucht (Typen der Basisklassen)
      - run: pip install -r requirements_test.txt
      - run: pip install ruff==0.17.6 mypy==2.4.1
      - name: ruff (Regeln in pyproject.toml)
        run: ruff check .
      - name: mypy (Integrationscode)
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant gibt Python- und pymodbus-Version vor (package_constraints.txt).
        # pytest-homeassistant-custom-component installiert jeweils das neueste Home
        # Assistant, das die Python-Version erlaubt:
        # - 3.13 / 3.11.2: älteste unterstützte Kombination (HA 2026.2)
        # - 3.14 / 3.13.1: aktuelles Home Assistant (2026.11 gibt pymodbus 3.13.1 vor)
        # - 3.14 / latest: zeigt Brüche neuer pymodbus-Versionen früh
        include:
          - python: "3.13"
            pymodbus: "3.11.2"
          - python: "3.14"
            pymodbus: "3.13.1"
          - python: "3.14"
            pymodbus: "latest"
    name: tests (Python ${{ matrix.python }}, pymodbus ${{ matrix.pymodbus }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # Heruntergeladene Pakete (Home Assistant samt Abhängigkeiten) wiederverwenden
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: pymodbus ${{ matrix.pymodbus }} installieren
        run: |
          if [ "${{ matrix.pymodbus }}" = "latest" ]; then
            pip install --upgrade pymodbus
          else
            pip install "pymodbus==${{ matrix.pymodbus }}"
          fi
          pip show pymodbus homeassistant | grep -i -E '^(name|version)'
      - run: pytest -q
