name: Validate

# Pull Requests werden einmal geprüft (nicht zusätzlich beim Push auf den Branch);
# Pushes laufen nur noch auf main.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben PR/Branch bricht den überholten Lauf ab
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant gibt die pymodbus-Version vor: 3.8.3 (HA 2025.3, älteste
        # unterstützte), 3.11.2 (HA 2026.2); "latest" zeigt Brüche neuer Versionen früh.
        pymodbus: ["3.8.3", "3.11.2", "latest"]
    name: tests (pymodbus ${{ matrix.pymodbus }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Heruntergeladene Pakete (Home Assistant samt Abhängigkeiten) wiederverwenden
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: pymodbus ${{ matrix.pymodbus }} installieren
        run: |
          if [ "${{ matrix.pymodbus }}" = "latest" ]; then
            pip install --upgrade pymodbus
          else
            pip install "pymodbus==${{ matrix.pymodbus }}"
          fi
          pip show pymodbus | grep -i '^version'
      - run: pytest -q
